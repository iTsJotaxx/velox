name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          if ($version) { ./build.ps1 -Version $version } else { ./build.ps1 }

      # The integration tests change system settings, so CI only builds them
      - name: Build integration tests
        run: dotnet build tests/Velox.IntegrationTests/Velox.IntegrationTests.csproj -c Release -nologo

      # Pure-logic checks (driver rules, device matching, NVIDIA names, temp cleaner): they change nothing
      - name: Unit checks
        shell: pwsh
        run: |
          & tests/Velox.IntegrationTests/bin/Release/net48/Velox.IntegrationTests.exe unit-checks.txt --unit
          $code = $LASTEXITCODE
          Get-Content unit-checks.txt
          exit $code

      - uses: actions/upload-artifact@v5
        with:
          name: Velox
          path: |
            dist/Velox.exe
            dist/Velox.exe.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Velox.exe
            dist/Velox.exe.sha256
          generate_release_notes: true
